<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX 渲染预览</title>
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-primary:hover {
            background: #f0f0f0;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            min-height: calc(100vh - 200px);
        }

        .panel {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background: #f8f9fa;
            padding: 1rem 1.5rem;
            border-bottom: 2px solid #e9ecef;
            font-weight: 600;
            font-size: 1.125rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .source-editor {
            flex: 1;
            padding: 1.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
            border: none;
            resize: none;
            background: #2d2d2d;
            color: #f8f8f2;
        }

        .source-editor:focus {
            outline: none;
        }

        .preview-area {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            background: white;
        }

        .preview-area::-webkit-scrollbar {
            width: 8px;
        }

        .preview-area::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .preview-area::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        /* LaTeX 渲染样式 */
        .rendered-content {
            max-width: 800px;
            line-height: 1.8;
            color: #333;
        }

        .rendered-content h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #111827;
            margin: 2rem 0 1.5rem;
            line-height: 1.3;
        }

        .rendered-content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            border-bottom: 2px solid #667eea;
            padding-bottom: 0.5rem;
            margin: 2rem 0 1rem;
            line-height: 1.3;
        }

        .rendered-content h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #374151;
            margin: 1.5rem 0 0.75rem;
            line-height: 1.3;
        }

        .rendered-content h4 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4b5563;
            margin: 1rem 0 0.5rem;
            line-height: 1.3;
        }

        /* 居中内容样式 - 让标题更突出 */
        .preview-area div[style*="text-align: center"] {
            font-size: 1.75rem;
            font-weight: 700;
            color: #111827;
            padding: 1.5rem 0;
            border-bottom: 3px solid #667eea;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .rendered-content p {
            margin: 1rem 0;
        }

        .rendered-content ul,
        .rendered-content ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }

        .rendered-content li {
            margin: 0.5rem 0;
        }

        .rendered-content strong {
            font-weight: 700;
            color: #1f2937;
        }

        .rendered-content em {
            font-style: italic;
            color: #374151;
        }

        .rendered-content .katex-display {
            margin: 1.5rem 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .rendered-content .katex {
            font-size: 1.1em;
        }

        .rendered-content pre {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 0.375rem;
            overflow-x: auto;
        }

        .rendered-content blockquote {
            border-left: 4px solid #e5e7eb;
            padding: 1rem;
            margin: 1rem 0;
            color: #666;
            font-style: italic;
            background: #f9fafb;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 0.375rem;
            margin: 1rem 0;
            border-left: 4px solid #c33;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
            }
            
            .panel {
                min-height: 400px;
            }
        }

        .stats-bar {
            padding: 0.75rem 1.5rem;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 2rem;
            font-size: 0.875rem;
            color: #666;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📄 LaTeX 渲染预览</h1>
        <p style="opacity: 0.9;">实时预览LaTeX文档效果</p>
        
        <div class="header-controls">
            <button class="btn btn-primary" onclick="renderLatex()">
                🔄 重新渲染
            </button>
            <button class="btn btn-secondary" onclick="downloadPDF()">
                📥 下载PDF
            </button>
            <button class="btn btn-secondary" onclick="window.close()">
                ✖ 关闭
            </button>
        </div>
    </div>

    <div class="container">
        <div class="layout">
            <!-- 源代码面板 -->
            <div class="panel">
                <div class="panel-header">
                    <span>LaTeX 源代码</span>
                    <button class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;" onclick="copySource()">
                        复制
                    </button>
                </div>
                <textarea class="source-editor" id="latexSource"></textarea>
                <div class="stats-bar">
                    <div class="stat-item">
                        <span>📝 行数:</span>
                        <span id="lineCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span>🔤 字符:</span>
                        <span id="charCount">0</span>
                    </div>
                </div>
            </div>

            <!-- 预览面板 -->
            <div class="panel">
                <div class="panel-header">
                    <span>渲染预览</span>
                    <button class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;" onclick="toggleFullscreen()">
                        全屏
                    </button>
                </div>
                <div class="preview-area" id="previewArea">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>正在渲染LaTeX...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- KaTeX JS -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script>
        // 从URL参数或localStorage获取LaTeX内容
        let latexContent = '';
        
        // 尝试从URL参数获取
        const urlParams = new URLSearchParams(window.location.search);
        const contentParam = urlParams.get('content');
        
        if (contentParam) {
            try {
                latexContent = decodeURIComponent(contentParam);
            } catch (e) {
                console.error('解码失败:', e);
            }
        }
        
        // 如果没有URL参数，尝试从localStorage获取
        if (!latexContent) {
            latexContent = localStorage.getItem('latexContent') || '';
        }
        
        // 如果还是没有，尝试从opener获取
        if (!latexContent && window.opener && window.opener.latexContent) {
            latexContent = window.opener.latexContent;
        }
        
        // 显示源代码
        const sourceEditor = document.getElementById('latexSource');
        sourceEditor.value = latexContent;
        
        // 更新统计
        updateStats();
        
        // 自动渲染
        setTimeout(() => {
            renderLatex();
        }, 500);
        
        // 源代码改变时更新统计
        sourceEditor.addEventListener('input', updateStats);
        
        function updateStats() {
            const content = sourceEditor.value;
            const lines = content.split('\n').length;
            const chars = content.length;
            
            document.getElementById('lineCount').textContent = lines;
            document.getElementById('charCount').textContent = chars;
        }
        
        function renderLatex() {
            const content = sourceEditor.value;
            const previewArea = document.getElementById('previewArea');
            
            // 显示加载状态
            previewArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在渲染LaTeX...</p>
                </div>
            `;
            
            setTimeout(() => {
                try {
                    // 简单的LaTeX到HTML转换
                    let html = processLatexContent(content);
                    
                    previewArea.innerHTML = `<div class="rendered-content">${html}</div>`;
                    
                    // 使用KaTeX渲染数学公式
                    renderMathInElement(previewArea, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\[', right: '\\]', display: true},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\begin{equation}', right: '\\end{equation}', display: true},
                            {left: '\\begin{align}', right: '\\end{align}', display: true},
                            {left: '\\begin{aligned}', right: '\\end{aligned}', display: true}
                        ],
                        throwOnError: false,
                        errorColor: '#cc0000',
                        strict: false,
                        trust: true
                    });
                    
                } catch (error) {
                    previewArea.innerHTML = `
                        <div class="error-message">
                            <strong>渲染错误:</strong><br>
                            ${error.message}
                        </div>
                    `;
                }
            }, 300);
        }
        
        function processLatexContent(content) {
            // 移除文档类和导言区
            content = content.replace(/\\documentclass.*?\n/g, '');
            content = content.replace(/\\usepackage.*?\n/g, '');
            content = content.replace(/\\begin{document}/g, '');
            content = content.replace(/\\end{document}/g, '');
            content = content.replace(/\\title.*?\n/g, '');
            content = content.replace(/\\author.*?\n/g, '');
            content = content.replace(/\\date.*?\n/g, '');
            content = content.replace(/\\maketitle/g, '');
            
            // 转换center环境
            content = content.replace(/\\begin\{center\}([\s\S]*?)\\end\{center\}/g, (match, p1) => {
                return `<div style="text-align: center; margin: 1rem 0;">${p1.trim()}</div>`;
            });
            
            // 转换其他对齐环境
            content = content.replace(/\\begin\{flushleft\}([\s\S]*?)\\end\{flushleft\}/g, (match, p1) => {
                return `<div style="text-align: left; margin: 1rem 0;">${p1.trim()}</div>`;
            });
            content = content.replace(/\\begin\{flushright\}([\s\S]*?)\\end\{flushright\}/g, (match, p1) => {
                return `<div style="text-align: right; margin: 1rem 0;">${p1.trim()}</div>`;
            });
            
            // 转换定理环境
            content = content.replace(/\\begin\{theorem\}([\s\S]*?)\\end\{theorem\}/g, (match, p1) => {
                return `<div style="border-left: 4px solid #667eea; padding: 1rem; margin: 1rem 0; background: #f0f4ff;"><strong>定理:</strong> ${p1.trim()}</div>`;
            });
            content = content.replace(/\\begin\{definition\}([\s\S]*?)\\end\{definition\}/g, (match, p1) => {
                return `<div style="border-left: 4px solid #10b981; padding: 1rem; margin: 1rem 0; background: #f0fdf4;"><strong>定义:</strong> ${p1.trim()}</div>`;
            });
            content = content.replace(/\\begin\{proof\}([\s\S]*?)\\end\{proof\}/g, (match, p1) => {
                return `<div style="border-left: 4px solid #f59e0b; padding: 1rem; margin: 1rem 0; background: #fffbeb;"><strong>证明:</strong> ${p1.trim()}</div>`;
            });
            content = content.replace(/\\begin\{lemma\}([\s\S]*?)\\end\{lemma\}/g, (match, p1) => {
                return `<div style="border-left: 4px solid #8b5cf6; padding: 1rem; margin: 1rem 0; background: #faf5ff;"><strong>引理:</strong> ${p1.trim()}</div>`;
            });
            
            // 转换章节标题
            content = content.replace(/\\section\*?\{([^}]+)\}/g, '<h2>$1</h2>');
            content = content.replace(/\\subsection\*?\{([^}]+)\}/g, '<h3>$1</h3>');
            content = content.replace(/\\subsubsection\*?\{([^}]+)\}/g, '<h4>$1</h4>');
            
            // 转换文本样式
            content = content.replace(/\\textbf\{([^}]+)\}/g, '<strong>$1</strong>');
            content = content.replace(/\\textit\{([^}]+)\}/g, '<em>$1</em>');
            content = content.replace(/\\emph\{([^}]+)\}/g, '<em>$1</em>');
            content = content.replace(/\\underline\{([^}]+)\}/g, '<u>$1</u>');
            
            // 转换列表
            content = content.replace(/\\begin\{itemize\}/g, '<ul>');
            content = content.replace(/\\end\{itemize\}/g, '</ul>');
            content = content.replace(/\\begin\{enumerate\}/g, '<ol>');
            content = content.replace(/\\end\{enumerate\}/g, '</ol>');
            content = content.replace(/\\item\s+/g, '<li>');
            
            // 转换引用环境
            content = content.replace(/\\begin\{quote\}([\s\S]*?)\\end\{quote\}/g, (match, p1) => {
                return `<blockquote style="border-left: 4px solid #e5e7eb; padding: 1rem; margin: 1rem 0; color: #666; font-style: italic;">${p1.trim()}</blockquote>`;
            });
            
            // 转换verbatim环境
            content = content.replace(/\\begin\{verbatim\}([\s\S]*?)\\end\{verbatim\}/g, (match, p1) => {
                return `<pre style="background: #f5f5f5; padding: 1rem; border-radius: 0.375rem; overflow-x: auto;"><code>${p1.trim()}</code></pre>`;
            });
            
            // 转换换行命令
            content = content.replace(/\\\\/g, '<br>');
            content = content.replace(/\\newline/g, '<br>');
            
            // 转换段落
            content = content.split('\n\n').map(para => {
                para = para.trim();
                if (para && !para.startsWith('<') && !para.includes('\\[') && !para.includes('$$') && !para.includes('\\begin')) {
                    return `<p>${para}</p>`;
                }
                return para;
            }).join('\n');
            
            // 清理注释
            content = content.replace(/^%.*$/gm, '');
            
            return content;
        }
        
        function copySource() {
            sourceEditor.select();
            document.execCommand('copy');
            alert('✅ 源代码已复制到剪贴板！');
        }
        
        function toggleFullscreen() {
            const previewArea = document.getElementById('previewArea').parentElement;
            if (!document.fullscreenElement) {
                previewArea.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
        
        function downloadPDF() {
            alert('PDF导出功能需要服务器端支持。\n\n建议使用以下方式:\n1. 复制LaTeX代码到Overleaf\n2. 使用本地LaTeX编译器');
        }
    </script>
</body>
</html>
